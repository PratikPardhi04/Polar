services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB: polaris
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://polaris:polaris@db:5432/polaris

  ai:
    build: ./ai
    ports:
      - "8001:8001"
    depends_on:
      - backend

volumes:
  pgdata:
